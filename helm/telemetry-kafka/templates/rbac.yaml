apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "telemetry-kafka.name" . }}
  labels:
    {{- include "telemetry-kafka.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
  {{- if .Values.podMetrics.enabled }}
  - apiGroups: [""]
    resources: [nodes/metrics]
    verbs: [get]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "telemetry-kafka.name" . }}
  labels:
    {{- include "telemetry-kafka.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "telemetry-kafka.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "telemetry-kafka.name" . }}
    namespace: {{ .Release.Namespace }}
